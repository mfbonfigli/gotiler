name: Build

on:
  pull_request:
    branches:
      - v3
  push:
    branches:
      - v3

permissions:
  contents: read

# Every dependency is public, so no access token is needed to build.
# Test binaries run from their package directories in a checkout of the
# repository (tests read testdata/ files relative to it), with PROJ_DATA
# pointing at the PROJ database built alongside them: see scripts/run-tests.sh.

jobs:
  # -------------------------------------------------------------------
  # Build and test: linux-amd64 (native; tests run inline)
  # -------------------------------------------------------------------
  build-linux-amd64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and test linux-amd64
        shell: bash
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh linux-amd64

  # -------------------------------------------------------------------
  # Build: linux-arm64 (cross-compiled on amd64)
  # -------------------------------------------------------------------
  build-linux-arm64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build linux-arm64
        shell: bash
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh linux-arm64

      - name: Upload linux-arm64 test binaries
        uses: actions/upload-artifact@v7
        with:
          name: build-linux-arm64-tests-${{ github.run_id }}
          path: |
            build/tests/linux-arm64/
            build/linux-arm64/share/
          if-no-files-found: error

  # -------------------------------------------------------------------
  # Test: linux-arm64 (run natively on ARM64 runner)
  # -------------------------------------------------------------------
  test-linux-arm64:
    needs: build-linux-arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download linux-arm64 test binaries
        uses: actions/download-artifact@v8
        with:
          name: build-linux-arm64-tests-${{ github.run_id }}
          path: build/

      - name: Run linux-arm64 tests
        shell: bash
        run: bash scripts/run-tests.sh build/tests/linux-arm64 build/linux-arm64/share

  # -------------------------------------------------------------------
  # Build: windows-amd64 (cross-compiled on Linux via mingw-w64)
  # -------------------------------------------------------------------
  build-windows-amd64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build windows-amd64
        shell: bash
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh windows-amd64

      - name: Upload windows-amd64 test binaries
        uses: actions/upload-artifact@v7
        with:
          name: build-windows-amd64-tests-${{ github.run_id }}
          path: |
            build/tests/windows-amd64/
            build/windows-amd64/share/
          if-no-files-found: error

  # -------------------------------------------------------------------
  # Test: windows-amd64 (run natively on Windows runner)
  # -------------------------------------------------------------------
  test-windows-amd64:
    needs: build-windows-amd64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download windows-amd64 test binaries
        uses: actions/download-artifact@v8
        with:
          name: build-windows-amd64-tests-${{ github.run_id }}
          path: build/

      - name: Run windows-amd64 tests
        shell: bash
        run: bash scripts/run-tests.sh build/tests/windows-amd64 build/windows-amd64/share
