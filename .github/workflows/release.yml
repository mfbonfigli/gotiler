name: Draft Release

on:
  push:
    tags:
      - 'v3.*'

permissions:
  contents: read
  actions: read

# Every dependency is public, so no access token is needed to build.
# Test binaries run from their package directories in a checkout of the
# repository (tests read testdata/ files relative to it), with PROJ_DATA
# pointing at the PROJ database built alongside them: see scripts/run-tests.sh.

jobs:
  # -------------------------------------------------------------------
  # Build and test: linux-amd64 (native; tests run inline)
  # -------------------------------------------------------------------
  build-linux-amd64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and test linux-amd64
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          chmod +x scripts/build.sh
          ./scripts/build.sh linux-amd64 --version "${VERSION#v}"

      - name: Upload linux-amd64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: gotiler-linux-amd64
          path: build/linux-amd64/
          if-no-files-found: error

  # -------------------------------------------------------------------
  # Build: linux-arm64 (cross-compiled on amd64)
  # -------------------------------------------------------------------
  build-linux-arm64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build linux-arm64
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          chmod +x scripts/build.sh
          ./scripts/build.sh linux-arm64 --version "${VERSION#v}"

      - name: Upload linux-arm64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: gotiler-linux-arm64
          path: build/linux-arm64/
          if-no-files-found: error

      - name: Upload linux-arm64 test binaries
        uses: actions/upload-artifact@v7
        with:
          name: gotiler-linux-arm64-tests
          path: |
            build/tests/linux-arm64/
            build/linux-arm64/share/
          if-no-files-found: error

  # -------------------------------------------------------------------
  # Test: linux-arm64 (run natively on ARM64 runner)
  # -------------------------------------------------------------------
  test-linux-arm64:
    needs: build-linux-arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download linux-arm64 test binaries
        uses: actions/download-artifact@v8
        with:
          name: gotiler-linux-arm64-tests
          path: build/

      - name: Run linux-arm64 tests
        shell: bash
        run: bash scripts/run-tests.sh build/tests/linux-arm64 build/linux-arm64/share

  # -------------------------------------------------------------------
  # Build: windows-amd64 (cross-compiled on Linux via mingw-w64)
  # -------------------------------------------------------------------
  build-windows-amd64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build windows-amd64
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          chmod +x scripts/build.sh
          ./scripts/build.sh windows-amd64 --version "${VERSION#v}"

      - name: Upload windows-amd64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: gotiler-windows-amd64
          path: build/windows-amd64/
          if-no-files-found: error

      - name: Upload windows-amd64 test binaries
        uses: actions/upload-artifact@v7
        with:
          name: gotiler-windows-amd64-tests
          path: |
            build/tests/windows-amd64/
            build/windows-amd64/share/
          if-no-files-found: error

  # -------------------------------------------------------------------
  # Test: windows-amd64 (run natively on Windows runner)
  # -------------------------------------------------------------------
  test-windows-amd64:
    needs: build-windows-amd64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download windows-amd64 test binaries
        uses: actions/download-artifact@v8
        with:
          name: gotiler-windows-amd64-tests
          path: build/

      - name: Run windows-amd64 tests
        shell: bash
        run: bash scripts/run-tests.sh build/tests/windows-amd64 build/windows-amd64/share

  # -------------------------------------------------------------------
  # Build and test: darwin-arm64 (native on an Apple Silicon runner, as
  # Docker cannot build macOS executables; tests run inline)
  # -------------------------------------------------------------------
  build-darwin-arm64:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # the license and test scripts need bash 4 or later: macOS ships 3.2
      - name: Install bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install bash

      - name: Build and test darwin-arm64
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          bash scripts/build.sh darwin-arm64 --version "${VERSION#v}"

      - name: Upload darwin-arm64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: gotiler-darwin-arm64
          path: build/darwin-arm64/
          if-no-files-found: error

  # -------------------------------------------------------------------
  # Smoke test: darwin-arm64 executable on a clean runner with a newer
  # macOS, which has neither the build's libraries nor PROJ
  # -------------------------------------------------------------------
  smoke-test-darwin-arm64:
    needs: build-darwin-arm64
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download darwin-arm64 artifact
        uses: actions/download-artifact@v8
        with:
          name: gotiler-darwin-arm64
          path: build/darwin-arm64/

      - name: Run the darwin-arm64 executable
        shell: bash
        run: bash scripts/smoke-test.sh build/darwin-arm64

  # -------------------------------------------------------------------
  # Create draft GitHub Release with 4 per-platform archives (.tar.gz
  # for Linux and macOS, .zip for Windows), their SHA-256 checksums and
  # signed build provenance attestations
  # -------------------------------------------------------------------
  create-release:
    needs:
      - build-linux-amd64
      - test-linux-arm64
      - test-windows-amd64
      - smoke-test-darwin-arm64
    runs-on: ubuntu-24.04
    if: success()
    permissions:
      contents: write      # create the draft release
      actions: read
      id-token: write      # sign the attestations through Sigstore
      attestations: write  # store the attestations
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download linux-amd64 artifact
        uses: actions/download-artifact@v8
        with:
          name: gotiler-linux-amd64
          path: artifacts/linux-amd64

      - name: Download linux-arm64 artifact
        uses: actions/download-artifact@v8
        with:
          name: gotiler-linux-arm64
          path: artifacts/linux-arm64

      - name: Download windows-amd64 artifact
        uses: actions/download-artifact@v8
        with:
          name: gotiler-windows-amd64
          path: artifacts/windows-amd64

      - name: Download darwin-arm64 artifact
        uses: actions/download-artifact@v8
        with:
          name: gotiler-darwin-arm64
          path: artifacts/darwin-arm64

      - name: Create release archives
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          for target in linux-amd64 linux-arm64 windows-amd64 darwin-arm64; do
            bash scripts/package.sh "$target" "artifacts/$target" "$TAG" release-assets
          done
          cp scripts/install.sh release-assets/
          ls -la release-assets/

      - name: Generate checksums
        shell: bash
        working-directory: release-assets
        run: |
          sha256sum gotiler-* install.sh > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            release-assets/gotiler-*
            release-assets/install.sh

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          name: ${{ github.ref_name }}
          body: |
            ## gotiler ${{ github.ref_name }}

            ### Install

            On Linux and macOS, install the latest release in your home folder:

            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | sh
            ```

            The script checks the download against `SHA256SUMS`. To install this release instead of the latest one, add `GOTILER_VERSION=${{ github.ref_name }}` before `sh`. See the README for the other settings.

            ### Downloads

            | Platform | File |
            |----------|------|
            | Linux x86_64 | `gotiler-linux-amd64-${{ github.ref_name }}.tar.gz` |
            | Linux ARM64  | `gotiler-linux-arm64-${{ github.ref_name }}.tar.gz` |
            | Windows x86_64 | `gotiler-windows-amd64-${{ github.ref_name }}.zip` |
            | macOS Apple Silicon | `gotiler-darwin-arm64-${{ github.ref_name }}.tar.gz` |

            Each archive contains the executable, PROJ data files (`share/`), and license documentation, including the platform's third-party licenses. The `.tar.gz` archives extract into a `gotiler-<platform>-${{ github.ref_name }}` folder:

            ```bash
            tar -xzf gotiler-linux-amd64-${{ github.ref_name }}.tar.gz
            ```

            ### macOS

            The macOS executable is not signed with an Apple Developer ID or notarized, so macOS blocks it when the archive was downloaded with a browser. Before extracting it, remove the download's quarantine flag:

            ```bash
            xattr -d com.apple.quarantine gotiler-darwin-arm64-${{ github.ref_name }}.tar.gz
            ```

            If it is already extracted, run `xattr -dr com.apple.quarantine gotiler-darwin-arm64-${{ github.ref_name }}` on the extracted folder instead. Downloads made with `curl` or `gh release download` have no quarantine flag. The executable needs an Apple Silicon Mac with macOS 12 or later.

            ### Verifying downloads

            `SHA256SUMS` lists the SHA-256 checksum of every archive. On Linux, from the download folder:

            ```bash
            sha256sum -c SHA256SUMS --ignore-missing
            ```

            On macOS:

            ```bash
            grep gotiler-darwin-arm64 SHA256SUMS | shasum -a 256 -c
            ```

            On Windows, compare the output of `Get-FileHash <zip>` with the zip's line in `SHA256SUMS`.

            Every archive also has a signed build provenance attestation, proving it was built by this repository's release workflow. With the GitHub CLI:

            ```bash
            gh attestation verify gotiler-linux-amd64-${{ github.ref_name }}.tar.gz --repo ${{ github.repository }}
            ```
          files: |
            release-assets/gotiler-*
            release-assets/install.sh
            release-assets/SHA256SUMS
